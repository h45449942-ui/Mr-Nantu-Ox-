 '<div class="sec">📊 App-wise Views / Download Clicks</div>'+ap.map(function(r){return '<div class="row"><div class="nm"><b>'+esc(r[0])+'</b><small>👁 '+r[1]+' · ⬇ '+r[2]+'</small></div><div class="bar" style="max-width:90px"><i style="width:'+Math.round((r[1]+r[2])/m2*100)+'%"></i></div></div>'}).join('')+'<button class="btn w" style="margin-top:10px" onclick="csvA()">⬇ Analytics CSV</button></div>'};
function csvA(){var d=D.an.days||{};csv('analytics.csv',[['Date','Visitors']].concat(Object.keys(d).sort().map(function(k){return [k,d[k]]})).concat([[],['App','Views','Downloads']]).concat(D.apps.map(function(a){var s=D.stats[a.id]||{};return [a.name,s.views||0,s.dl||0]})))}

/* ---------- Content ---------- */
V.cont=function(){var s=D.set,bn=list(s.banners).map(function(b){return b.t+(b.u?' | '+b.u:'')}).join('\n'),NF=list(D.nf).sort(function(a,b){return b.t-a.t}),RV=[];
 Object.keys(D.rev).forEach(function(a){Object.keys(D.rev[a]||{}).forEach(function(u){var r=D.rev[a][u];r.app=a;r.uid=u;RV.push(r)})});RV.sort(function(a,b){return b.t-a.t});var RP=list(D.rep).sort(function(a,b){return b.t-a.t});
 return AIMG(s)+'<div class="card"><h3>🖼 Banner & Welcome Text</h3><br><input class="in" id="sWel" placeholder="Welcome Text (होम पर)" value="'+esc(s.welcomeText||'')+'"><textarea class="in" id="sBan" placeholder="Banners — हर लाइन: टेक्स्ट | लिंक">'+esc(bn)+'</textarea><button class="btn p w" onclick="saveBan()">💾 सेव करें</button></div>'+
 '<div class="card"><h3>📣 Announcement / Notification</h3><br><input class="in" id="nT" placeholder="शीर्षक"><textarea class="in" id="nB" placeholder="संदेश"></textarea><button class="btn p w" onclick="sendNf()">📢 सभी यूज़र को भेजें</button>'+NF.slice(0,8).map(function(n){return '<div class="row"><div class="nm"><b>'+esc(n.title)+'</b><small>'+esc(n.body||'')+'</small></div><button class="btn s d" onclick="xdel(\'notifs/'+n.id+'\')">✕</button></div>'}).join('')+'</div>'+
 '<div class="card"><h3>⭐ Reviews ('+RV.length+')</h3>'+(RV.slice(0,10).map(function(r){var a=D.apps.filter(function(x){return x.id===r.app})[0];return '<div class="row"><div class="nm"><b>'+esc(a?a.name:r.app)+' '+'★'.repeat(r.r)+'</b><small>'+esc(r.u)+': '+esc(r.x)+'</small></div><button class="btn s d" onclick="xdel(\'reviews/'+r.app+'/'+r.uid+'\')">✕</button></div>'}).join('')||'<p class="mu">कोई रिव्यू नहीं।</p>')+'</div>'+
 '<div class="card"><h3>🚩 App Reports ('+RP.length+')</h3>'+(RP.slice(0,15).map(function(r){return '<div class="row"><div class="nm"><b>'+esc(r.n||r.id)+'</b><small>'+esc(r.x)+' — '+esc(r.u)+'</small></div><button class="btn s p" onclick="xdel(\'reports/'+r.id+'\')">✔ हल</button></div>'}).join('')||'<p class="mu">कोई शिकायत नहीं।</p>')+'</div>'};
function xdel(p){A('DELETE',p).then(function(){log('Delete',p);load()}).catch(function(e){toast(er(e),true)})}
function sendNf(){var t=$('nT').value.trim();if(!t)return toast('शीर्षक लिखें',true);A('POST','notifs',{title:t,body:$('nB').value.trim(),t:Date.now()}).then(function(){log('Announcement',t);toast('📢 भेज दिया');load()}).catch(function(e){toast(er(e),true)})}
function pl(id){return $(id).value.split('\n').map(function(l){var p=l.split('|');return {t:(p[0]||'').trim(),u:(p[1]||'').trim()}}).filter(function(x){return x.t})}
function saveBan(){A('PATCH','settings',{welcomeText:$('sWel').value.trim(),banners:pl('sBan')}).then(function(){log('Banner/Welcome','सेव');toast('✅ सेव हुआ');load()}).catch(function(e){toast(er(e),true)})}

/* ---------- Settings ---------- */
V.set=function(){var s=D.set,lk=list(s.links).map(function(b){return b.t+' | '+b.u}).join('\n'),LG=list(D.log).sort(function(a,b){return b.t-a.t}),pg=Math.max(0,Math.min(P.l,Math.ceil(LG.length/PS)-1));P.l=pg;
 var f=function(id,l,v,ta){return '<label class="mu" style="font-size:12px">'+l+'</label>'+(ta?'<textarea class="in" id="'+id+'">'+esc(v||'')+'</textarea>':'<input class="in" id="'+id+'" value="'+esc(v||'')+'">')};
 return '<div class="card"><h3>⚙️ Store Settings</h3><br>'+f('tTi','Store Title',s.title)+f('tLo','Logo Image Link',s.logo)+f('tTg','Telegram Link',s.telegram)+f('tSu','Support Link',s.support)+f('tLk','Footer Links (हर लाइन: नाम | लिंक)',lk,1)+f('tFt','Footer Text',s.footer)+f('tPr','Privacy Policy',s.privacy,1)+f('tTm','Terms',s.terms,1)+
 '<label style="display:block;margin-bottom:12px"><input type="checkbox" id="tMt" '+(s.maintenance?'checked':'')+'> 🛠️ Maintenance Mode</label><button class="btn p w" onclick="saveSet()">💾 Settings सेव करें</button></div>'+
 '<div class="card"><h3>🧾 Admin Activity Logs ('+LG.length+')</h3>'+LG.slice(pg*PS,pg*PS+PS).map(function(l){return '<div class="row"><div class="nm"><b>'+esc(l.a)+'</b><small>'+esc(l.d)+' · '+when(l.t)+'</small></div></div>'}).join('')+pgr(LG.length,pg,PS,'pgL')+'</div>'+
 '<div class="card"><h3>💾 Backup / Restore</h3><br><div style="display:flex;gap:8px"><button class="btn p" style="flex:1" onclick="bk()">⬇ Backup</button><label class="btn" style="flex:1;text-align:center">⬆ Restore<input type="file" accept=".json" hidden onchange="rs(this)"></label></div></div>'};
function saveSet(){var g=function(i){return $(i).value.trim()};A('PATCH','settings',{title:g('tTi'),logo:g('tLo'),telegram:g('tTg'),support:g('tSu'),links:pl('tLk'),footer:g('tFt'),privacy:$('tPr').value,terms:$('tTm').value,maintenance:$('tMt').checked}).then(function(){log('Settings',$('tMt').checked?'Maintenance ON':'सेव');toast('✅ सेव हुईं');load()}).catch(function(e){toast(er(e),true)})}
function bk(){var P=['apps','cats','stats','users','usernames','reviews','reports','notifs','settings','logs'];Promise.all(P.map(function(p){return A('GET',p)})).then(function(r){var o={};P.forEach(function(p,i){o[p]=r[i]});var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='backup-'+dstr()+'.json';a.click();log('Backup','Database')}).catch(function(e){toast(er(e),true)})}
function rs(inp){var f=inp.files[0];if(!f||!confirm('इस बैकअप से डेटा वापस लाएँ? मौजूदा डेटा बदल जाएगा।'))return;var r=new FileReader();r.onload=function(){Promise.all(Object.keys(JSON.parse(r.result)).map(function(k){return A('PUT',k,JSON.parse(r.result)[k])})).then(function(){log('Restore','Database');toast('✅ रिस्टोर हो गया');load()}).catch(function(e){toast(er(e),true)})};r.readAsText(f);inp.value=''}
setInterval(function(){var e=$('aclk');if(e){var n=new Date();e.innerHTML='<b class="clk">🕒 '+n.toLocaleTimeString('hi-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</b><small>'+n.toLocaleDateString('hi-IN',{weekday:'short',day:'2-digit',month:'short'})+'</small>'}},1000);

(function(){var cur=null,sel='.card,.app,.st';function rs(){if(cur){cur.style.setProperty('--rx','0deg');cur.style.setProperty('--ry','0deg');cur=null}}
document.addEventListener('pointermove',function(e){var t=e.target.closest&&e.target.closest(sel);if(!t){rs();return}var r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;if(cur&&cur!==t)rs();cur=t;t.style.setProperty('--rx',(-y*12)+'deg');t.style.setProperty('--ry',(x*14)+'deg')},{passive:true});
document.addEventListener('pointerup',function(){setTimeout(rs,300)});
var P=document.createElement('div');P.className='bgp';var h='';for(var i=0;i<20;i++){var z=2+Math.random()*4;h+='<b style="left:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-duration:'+(8+Math.random()*10)+'s;animation-delay:-'+Math.random()*12+'s"></b>'}P.innerHTML=h;document.body.insertBefore(P,document.body.firstChild)})();
start();
